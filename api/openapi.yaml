        '400':
          description: 字段非法或 model_id / channel_id / protocol_id 不存在（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 model.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 唯一键已存在（resource_state_conflict）
