        updated_at: {type: string, format: date-time}
    AnnouncementWriteRequest:
      type: object
      properties:
        title: {type: string, maxLength: 128}
        content: {type: string, maxLength: 20000}
        ann_type: {type: string, enum: [NOTICE, MAINTENANCE, PROMOTION, PRICE_CHANGE]}
        position_mask: {type: integer, format: int64, minimum: 1, maximum: 15}
        pinned: {type: boolean}
        publish_at:
          type: string
          format: date-time
          description: 未来时间进入 SCHEDULED；过去/缺省不改变发布状态
        effective_from:
          type: string
          format: date-time
          description: 可见起点；与 publish_at 同时出现时不得早于它
        effective_to: {type: string, format: date-time, nullable: true}
        model_ids:
          type: array
          maxItems: 100
          items: {type: integer, format: int64}
          description: 缺省保留现有关系；[] 清空；白名单外/不存在的模型返回 400
    AnnouncementDetailResponse:
      type: object
      required: [announcement]
      properties:
        announcement: {$ref: '#/components/schemas/Announcement'}
    AdminChannel:
      type: object
      required: [id, name, protocol_id, protocol, region, base_url, upstream_key_mask, group_scope_mode, dedicated_scope_mode, fallback_allowed, weight, priority, timeout_connect_ms, timeout_first_byte_ms, timeout_total_ms, retry_max, stream_supported, stream_usage_mode, health_state, success_rate_bp, enabled, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        protocol_id: {type: integer, format: int64}
        protocol: {type: string}
        region: {type: string, enum: [DOMESTIC, OVERSEAS]}
        base_url: {type: string}
        upstream_key_mask: {type: string}
        key_rotation_at: {type: string, format: date-time, nullable: true}
        group_scope_mode: {type: string, enum: [ALL, SELECTED]}
        dedicated_scope_mode: {type: string, enum: [ALL, SELECTED]}
        fallback_allowed: {type: boolean}
        dedicated_user_ids:
          type: array
          items: {type: integer, format: int64}
        weight: {type: integer, format: int64}
        priority: {type: integer, format: int64}
        timeout_connect_ms: {type: integer, format: int64}
        timeout_first_byte_ms: {type: integer, format: int64}
        timeout_total_ms: {type: integer, format: int64}
        retry_max: {type: integer, format: int64}
        stream_supported: {type: boolean}
        stream_usage_mode: {type: string, enum: [NATIVE, STREAM_OPTIONS, ESTIMATE, UNKNOWN]}
        upstream_model_name_map:
          type: object
          additionalProperties: {type: string}
        health_state: {type: string, enum: [CLOSED, OPEN, HALF_OPEN, AUTH_FAIL]}
        success_rate_bp: {type: integer, format: int64, nullable: true, description: 近 15 分钟上游尝试成功率；窗口内无尝试时为 null，不返回 10000}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminChannelList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminChannel'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    AdminChannelDetail:
      type: object
      required: [channel]
      properties:
        channel: {$ref: '#/components/schemas/AdminChannel'}
    AdminChannelCreateRequest:
      type: object
      required: [name, protocol_id, region, base_url, upstream_key]
      description: |
        新建渠道。除五个必填项外全部有默认值；默认值与 `validateCreateChannel`
        一致。`region` 只接受 `DOMESTIC`（V1.0 仅境内渠道），给 `OVERSEAS` 返回
        400 并在 message 里说明这是产品限制而不是笔误。
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: 去首尾空白后按 rune 计 1..64；与软删行也算重复，重复返回 400}
        protocol_id: {type: integer, format: int64, minimum: 1, description: 必须存在于 t_protocol}
        region: {type: string, enum: [DOMESTIC], description: V1.0 仅境内；传 OVERSEAS 返回 400}
        base_url: {type: string, description: https 任意主机；http 只允许私有/回环地址（与网关出口策略一致）}
        upstream_key: {type: string, minLength: 1, maxLength: 512, description: 明文上游密钥，服务端用 CHANNEL_KEY_KEK 封装后入库；响应只回掩码}
        group_scope_mode: {type: string, enum: [ALL, SELECTED], default: ALL}
        dedicated_scope_mode: {type: string, enum: [ALL, SELECTED], default: ALL}
        dedicated_user_ids:
          type: array
          items: {type: integer, format: int64}
          description: 只有 dedicated_scope_mode=SELECTED 时才允许非空，否则 400
        fallback_allowed: {type: boolean, default: false}
        weight: {type: integer, format: int64, minimum: 0, maximum: 1000000, default: 100}
        priority: {type: integer, format: int64, minimum: -32768, maximum: 32767, default: 100}
        timeout_connect_ms: {type: integer, format: int64, minimum: 1, maximum: 600000, default: 3000}
        timeout_first_byte_ms: {type: integer, format: int64, minimum: 1, maximum: 600000, default: 60000}
        timeout_total_ms: {type: integer, format: int64, minimum: 1, maximum: 3600000, default: 120000}
        retry_max: {type: integer, format: int64, minimum: 0, maximum: 2, default: 2, description: 上限 2 是硬约束}
        stream_supported: {type: boolean, default: true}
        stream_usage_mode: {type: string, enum: [NATIVE, STREAM_OPTIONS, ESTIMATE, UNKNOWN], default: UNKNOWN}
        upstream_model_name_map:
          type: object
          additionalProperties: {type: string}
          description: |
            平台模型名/别名 → 上游真实模型名。键必须是已登记模型名或启用中的别名，
            否则 400；最多 200 条，键与值都按 rune 计不超过 128。
        enabled: {type: boolean, default: true}
    AdminChannelPatchRequest:
      type: object
      minProperties: 1
      description: |
        与创建同名的字段同语义，但全部可选：缺省表示「不动」。合并到当前行后再
        整体校验，因此单独发 `dedicated_scope_mode` 也可能因为存量
        `dedicated_user_ids` 非法而被拒。
      properties:
        name: {type: string, minLength: 1, maxLength: 64, description: 与软删行也算重复，重复返回 400}
        protocol_id: {type: integer, format: int64, minimum: 1}
        region: {type: string, enum: [DOMESTIC]}
        base_url: {type: string}
        upstream_key: {type: string, minLength: 1, maxLength: 512, description: 给了就重新加密并刷新掩码与 key_rotation_at}
        group_scope_mode: {type: string, enum: [ALL, SELECTED]}
        dedicated_scope_mode: {type: string, enum: [ALL, SELECTED]}
        dedicated_user_ids:
          type: array
          items: {type: integer, format: int64}
          description: 缺省保留现有关系；[] 清空
        fallback_allowed: {type: boolean}
        weight: {type: integer, format: int64, minimum: 0, maximum: 1000000}
        priority: {type: integer, format: int64, minimum: -32768, maximum: 32767}
        timeout_connect_ms: {type: integer, format: int64, minimum: 1, maximum: 600000}
        timeout_first_byte_ms: {type: integer, format: int64, minimum: 1, maximum: 600000}
        timeout_total_ms: {type: integer, format: int64, minimum: 1, maximum: 3600000}
        retry_max: {type: integer, format: int64, minimum: 0, maximum: 2}
        stream_supported: {type: boolean}
        stream_usage_mode: {type: string, enum: [NATIVE, STREAM_OPTIONS, ESTIMATE, UNKNOWN]}
        upstream_model_name_map:
          type: object
          additionalProperties: {type: string}
          description: 缺省保留现有映射；{} 清空
        enabled: {type: boolean}
    AdminChannelDeleteResult:
      type: object
      required: [id, deleted]
      properties:
        id: {type: integer, format: int64}
        deleted: {type: boolean, description: 软删成功恒为 true（失败走 404/409）}
    AdminUpstreamModel:
      type: object
      required: [id, registered]
      description: 上游 `/v1/models` 的一条记录（`ops/upstreamModelItem`），外加平台侧标注
      properties:
        id: {type: string, description: 上游模型名，也是 `model_ids` 里要传的值}
        name: {type: string, description: 上游给的展示名；上游没给时不返回}
        context_window: {type: integer, format: int64, description: 上游报的上下文窗口；上游没给时不返回}
        max_output_tokens: {type: integer, format: int64, description: 上游报的输出上限；上游没给时不返回}
        registered: {type: boolean, description: 平台是否已有同名模型（t_model.model_name）}
        platform_model: {type: string, description: 该上游名映射到的平台模型（t_channel.upstream_model_name_map）；没有映射时不返回}
    AdminUpstreamModelList:
      type: object
      required: [items]
      description: 不分页：上游一次给多少就是多少（响应体上限 1 MB）
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminUpstreamModel'}
    AdminRegisterUpstreamModelsRequest:
      type: object
      required: [model_ids]
      properties:
        model_ids:
          type: array
          minItems: 1
          maxItems: 50
          items: {type: string}
          description: 上游模型名（`AdminUpstreamModel.id`）；去空白后去重，空串忽略。上游目录里没有的名字使整批 400
    AdminRegisterUpstreamModelsCreated:
      type: object
      required: [model_id, model_name, route_created]
      description: 本次真的新建的平台模型（恒为 CATALOG_ONLY、无价目）
      properties:
        model_id: {type: integer, format: int64}
        model_name: {type: string}
        route_created: {type: boolean, description: 同一事务里是否也建了 t_route（唯一键冲突时为 false）}
    AdminRegisterUpstreamModelsSkipped:
      type: object
      required: [model_name, reason]
      description: 已登记过、因此没有新建行的条目
      properties:
        model_name: {type: string}
        reason:
          type: string
          enum: [already_registered, already_registered_route_added]
          description: already_registered_route_added = 模型早就有，但这次补了一条本渠道的路由
    AdminRegisterUpstreamModelsResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: array
          items: {$ref: '#/components/schemas/AdminRegisterUpstreamModelsCreated'}
        skipped:
          type: array
          items: {$ref: '#/components/schemas/AdminRegisterUpstreamModelsSkipped'}
    AdminPriceRule:
      type: object
      required: [id, scope_level, model_id, model_name, model_type, in_price_micro_per_k, out_price_micro_per_k, per_call_price_micro, currency_cost, version, effective_from, enabled, created_at]
      description: 一条模型价目（`ops/priceRuleView`，对应 t_price_rule 的一行）
      properties:
        id: {type: integer, format: int64}
        scope_level: {type: string, enum: [MODEL], description: 本接口只暴露 MODEL 级价目}
        model_id: {type: integer, format: int64}
        model_name: {type: string, description: 联查 t_model 得到；模型行不在了为空串}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        in_price_micro_per_k: {type: integer, format: int64}
        out_price_micro_per_k: {type: integer, format: int64}
        per_call_price_micro: {type: integer, format: int64}
        cache_hit_ratio_bp: {type: integer, format: int64, description: 未配置时不返回}
        cache_write_ratio_bp: {type: integer, format: int64, description: 未配置时不返回}
        long_ctx_threshold_tokens: {type: integer, format: int64, description: 长上下文档位起点；未配置时不返回}
        long_ctx_in_price_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        long_ctx_out_price_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        cost_in_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        cost_out_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        cost_per_call_micro: {type: integer, format: int64, description: 未配置时不返回}
        currency_cost: {type: string, description: 恒为 CNY（写入时也只接受 CNY）}
        version: {type: integer, format: int64, description: 同一模型的版本号，创建时自增}
        effective_from: {type: string, format: date-time}
        effective_to: {type: string, format: date-time, description: 生效终点；未配置时不返回（表示长期有效）}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
    AdminPriceRuleList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminPriceRule'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    AdminPriceRuleDetail:
      type: object
      required: [price]
      properties:
        price: {$ref: '#/components/schemas/AdminPriceRule'}
    AdminPriceCreateRequest:
      type: object
      required: [model_id]
      description: |
        价格字段按模型类型分工：`TEXT` 要 `in/out_price_micro_per_k` > 0 且
        `per_call_price_micro` 必须为 0；`IMAGE` 要 `per_call_price_micro` > 0 且
        两个 token 价必须为 0；`EMBEDDING` 要 `in_price_micro_per_k` > 0，
        `out_price_micro_per_k` 与 `per_call_price_micro` 必须为 0。
        长上下文三件套是全有或全无：给了阈值就必须同时给两个长上下文价（都 > 0），
        反之亦然。
      properties:
        model_id: {type: integer, format: int64, minimum: 1, description: 目标模型；不存在或已软删返回 404}
        in_price_micro_per_k: {type: integer, format: int64, minimum: 0, description: 每千输入 token 的微积分价}
        out_price_micro_per_k: {type: integer, format: int64, minimum: 0}
        per_call_price_micro: {type: integer, format: int64, minimum: 0, description: 按次/按张计费价}
        cache_hit_ratio_bp: {type: integer, format: int64, minimum: 0, maximum: 100000, description: 缓存命中计费比例，上限 100000（=100%）}
        cache_write_ratio_bp: {type: integer, format: int64, minimum: 0, maximum: 100000}
        long_ctx_threshold_tokens: {type: integer, format: int64, minimum: 1, description: 给了它就必须同时给两个 long_ctx_* 价格}
        long_ctx_in_price_micro_per_k: {type: integer, format: int64, minimum: 1, description: 仅在与阈值同时给出时有效，且必须 > 0}
        long_ctx_out_price_micro_per_k: {type: integer, format: int64, minimum: 1, description: 仅在与阈值同时给出时有效，且必须 > 0}
        cost_in_micro_per_k: {type: integer, format: int64, minimum: 0, description: 上游成本；缺失时需要 confirm_no_cost=true}
        cost_out_micro_per_k: {type: integer, format: int64, minimum: 0}
        cost_per_call_micro: {type: integer, format: int64, minimum: 0}
        currency_cost: {type: string, enum: [CNY], default: CNY, description: 只接受 CNY（大小写不敏感），其它值 400}
        effective_from: {type: string, format: date-time, description: 缺省或早于服务端 now 时夹到 now；涨价必须 ≥ now+7 天}
        effective_to: {type: string, format: date-time, description: 必须晚于 effective_from，否则 400}
        enabled: {type: boolean, default: true}
        clear_fields:
          type: array
          items:
            type: string
            enum: [cache_hit_ratio_bp, cache_write_ratio_bp, long_ctx_threshold_tokens, long_ctx_in_price_micro_per_k, long_ctx_out_price_micro_per_k, cost_in_micro_per_k, cost_out_micro_per_k, cost_per_call_micro, effective_to]
          description: 把这些可空列置 NULL；白名单之外的值 400，与同名字段同时出现也 400
        confirm_no_cost: {type: boolean, default: false, description: 售价值有、成本价缺失时的二次确认；不传则 400 并列出缺哪些成本价}
    AdminPricePatchRequest:
      type: object
      minProperties: 1
      description: |
        与创建同名的价格字段同语义，全部可选（缺省 = 不改）。**不接受 `model_id`**：
        出现即 400。`clear_fields` 与 `confirm_no_cost` 同创建。
      properties:
        in_price_micro_per_k: {type: integer, format: int64, minimum: 0}
        out_price_micro_per_k: {type: integer, format: int64, minimum: 0}
        per_call_price_micro: {type: integer, format: int64, minimum: 0}
        cache_hit_ratio_bp: {type: integer, format: int64, minimum: 0, maximum: 100000}
        cache_write_ratio_bp: {type: integer, format: int64, minimum: 0, maximum: 100000}
        long_ctx_threshold_tokens: {type: integer, format: int64, minimum: 1}
        long_ctx_in_price_micro_per_k: {type: integer, format: int64, minimum: 1}
        long_ctx_out_price_micro_per_k: {type: integer, format: int64, minimum: 1}
        cost_in_micro_per_k: {type: integer, format: int64, minimum: 0}
        cost_out_micro_per_k: {type: integer, format: int64, minimum: 0}
        cost_per_call_micro: {type: integer, format: int64, minimum: 0}
        currency_cost: {type: string, enum: [CNY]}
        effective_from: {type: string, format: date-time, description: 缺省时保留原计划；显式给出且早于 now 时夹到 now}
        effective_to: {type: string, format: date-time, description: 必须晚于 effective_from}
        enabled: {type: boolean}
        clear_fields:
          type: array
          items:
            type: string
            enum: [cache_hit_ratio_bp, cache_write_ratio_bp, long_ctx_threshold_tokens, long_ctx_in_price_micro_per_k, long_ctx_out_price_micro_per_k, cost_in_micro_per_k, cost_out_micro_per_k, cost_per_call_micro, effective_to]
        confirm_no_cost: {type: boolean}
    AdminGroup:
      type: object
      required: [id, code, name, ratio_bp, model_scope_mode, channel_scope_mode, self_service, remark, enabled, model_ids, channel_ids, created_at, updated_at]
      description: 价格分组（`ops/groupView`，对应 t_price_group + 两张范围表）
      properties:
        id: {type: integer, format: int64}
        code: {type: string, description: 分组编码，internal 分组不可改名且倍率恒为 0}
        name: {type: string, maxLength: 64}
        ratio_bp: {type: integer, format: int64, description: 倍率（万分比）；10000 = 1.0 倍}
        model_scope_mode: {type: string, enum: [ALL, SELECTED]}
        channel_scope_mode: {type: string, enum: [ALL, SELECTED]}
        self_service: {type: boolean}
        min_margin_bp: {type: integer, format: int64, description: 该分组的最低毛利（万分比）；未配置时不返回}
        remark: {type: string, maxLength: 255}
        enabled: {type: boolean}
        model_ids:
          type: array
          items: {type: integer, format: int64}
          description: model_scope_mode=SELECTED 时的模型白名单
        channel_ids:
          type: array
          items: {type: integer, format: int64}
          description: channel_scope_mode=SELECTED 时的渠道白名单
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminGroupList:
      type: object
      required: [items, total]
      description: 分组不分页：只有 items + total（total = 返回条数），没有 page / page_size
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminGroup'}
        total: {type: integer, format: int64}
    AdminGroupKeySync:
      type: object
      required: [keys, ok]
      properties:
        keys: {type: integer, description: 受影响的 Key 数；倍率没变时为 0}
        ok: {type: boolean, description: 一致化是否成功；false 时 note 说明原因，配置已生效但不保证所有 Key 已刷到}
        note: {type: string, description: ok=false 时的说明}
    AdminGroupDetail:
      type: object
      required: [group, key_sync]
      properties:
        group: {$ref: '#/components/schemas/AdminGroup'}
        key_sync: {$ref: '#/components/schemas/AdminGroupKeySync'}
        warnings:
          type: array
          items: {type: string}
          description: 已确认保存、但范围内有无成本价模型时的提示；为空表示全部做了地板校验
    AdminGroupUpdateError:
      description: |
        分组保存的 400。除了标准错误信封外，**顶层**多一个 `warnings[]`
        （`writeGroupWarningError` 手写的信封，不是 apierr 的标准形状），
        列出范围内没有成本价、地板无法校验的模型。
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          properties:
            warnings:
              type: array
              items: {type: string}
    AdminGroupPatchRequest:
      type: object
      minProperties: 1
      description: |
        全部字段可选（缺省 = 不改）。`internal` 分组的保存必须带 `confirm=true`
        与非空 `reason`；倍率改小会重算该分组用户 Key 上的倍率。
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        ratio:
          type: [number, string]
          description: 十进制倍率（如 1.5、"0.8"）；最多 4 位小数，整数部分 ≤ 1000000。与 ratio_bp 同时给出时必须一致
        ratio_bp: {type: integer, format: int64, minimum: 0, description: 万分比整数形式（15000 = 1.5 倍）}
        model_scope_mode: {type: string, enum: [ALL, SELECTED]}
        channel_scope_mode: {type: string, enum: [ALL, SELECTED]}
        self_service: {type: boolean}
        min_margin_bp: {type: integer, format: int64, minimum: 0, maximum: 10000}
        remark: {type: string, maxLength: 255}
        enabled: {type: boolean}
        model_ids:
          type: array
          items: {type: integer, format: int64}
          description: 缺省保留现有范围；[] 清空
        channel_ids:
          type: array
          items: {type: integer, format: int64}
          description: 缺省保留现有范围；[] 清空
        confirm: {type: boolean, description: internal 保存与「范围含无成本价模型」两种场景的二次确认}
        reason: {type: string, description: internal 保存必填，写入审计的 reason 列}
    AdminOrder:
      type: object
      required: [id, order_no, order_type, pay_amount_fen, pay_amount_yuan, recharge_micro, bonus_micro, recharge, bonus, pay_channel, state, paid_at, expire_at, created_at, user_id, user_email, user_nickname]
      description: 运营视角的充值订单（`fund/adminOrderView` = 账号侧 `orderView` + 客户身份）
      properties:
        id: {type: integer, format: int64}
        order_no: {type: string}
        order_type: {type: string}
        plan_code: {type: string, description: 套餐 code；非套餐订单不返回}
        pay_amount_fen: {type: integer, format: int64, description: 应付金额（分）}
        pay_amount_yuan: {type: integer, format: int64, description: 应付金额（元，整数部分）}
        recharge_micro: {type: integer, format: int64, description: 到账充值积分（微积分）}
        bonus_micro: {type: integer, format: int64}
        recharge: {type: integer, format: int64, description: 到账充值（元）}
        bonus: {type: integer, format: int64}
        pay_channel: {type: string}
        state: {type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED, PARTIAL_REFUNDED]}
        paid_at:
          type: string
          format: date-time
          description: 支付时间；未支付时为 null
        expire_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        user_id: {type: integer, format: int64}
        user_email: {type: string}
        user_nickname: {type: string}
        pay_txn_id: {type: string, description: 渠道支付时为平台 trade_no，运营确认时为银行流水号；未支付时不返回}
    AdminOrderList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminOrder'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    AdminConfirmPaymentRequest:
      type: object
      required: [bank_txn_no]
      properties:
        bank_txn_no:
          type: string
          pattern: '^[A-Za-z0-9_-]{6,64}$'
          description: 银行流水号，运营的打款凭证；幂等锚点，同一号码重复提交不会二次入账
        note: {type: string, maxLength: 255, description: 运营备注，写审计}
    AdminConfirmPaymentResult:
      type: object
      required: [order, credited, replayed]
      properties:
        order: {$ref: '#/components/schemas/AdminOrder'}
        credited: {type: boolean, description: true = 钱已进账（幂等重放同样为 true）}
        replayed: {type: boolean, description: true = 该流水号此前已结算过这单，本次未写任何东西}
    AdminCloseOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 2, maxLength: 100, description: 作废理由，按 rune 计 2..100，写审计}
    AdminCloseOrderResult:
      type: object
      required: [order, closed, replayed]
      properties:
        order: {$ref: '#/components/schemas/AdminOrder'}
        closed: {type: boolean, description: true = 订单已不可支付}
        replayed: {type: boolean, description: true = 本来就是 CLOSED，本次未写任何东西}
    AdminRedeemBatch:
      type: object
      required: [id, batch_name, face_value_fen, face_value_yuan, quantity, generated_count, redeemed_count, valid_from, valid_to, credit_target, created_by, created_at]
      description: 兑换码批次（`fund/redeemBatchView`）。批次维度，不含明码。
      properties:
        id: {type: integer, format: int64}
        batch_name: {type: string, maxLength: 64}
        face_value_fen: {type: integer, format: int64, description: 面额（分）}
        face_value_yuan: {type: integer, format: int64, description: 面额（元，整数部分）}
        quantity: {type: integer, format: int64, description: 计划生成数量}
        generated_count: {type: integer, format: int64, description: 实际生成数量}
        redeemed_count: {type: integer, format: int64, description: 已兑换数量}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time}
        credit_target: {type: string, enum: [RECHARGE, BONUS], description: 兑换后记入哪个余额（BONUS 不计退款额度）}
        created_by: {type: integer, format: int64}
        created_by_email: {type: string, description: 创建人邮箱；账号行缺失时不返回}
        created_at: {type: string, format: date-time}
    AdminRedeemBatchList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminRedeemBatch'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
    AdminRedeemBatchCreateRequest:
      type: object
      required: [batch_name, face_value_fen, quantity, valid_days]
      properties:
        batch_name: {type: string, minLength: 1, maxLength: 64}
        face_value_fen: {type: integer, format: int64, minimum: 1, maximum: 65535, description: 面额（分），上限来自列类型}
        quantity: {type: integer, format: int64, minimum: 1, maximum: 500, description: 一次最多生成 500 张}
        credit_target: {type: string, enum: [RECHARGE, BONUS], default: BONUS}
        valid_days: {type: integer, format: int64, minimum: 1, maximum: 3650}
    AdminRedeemBatchCreateResult:
      type: object
      required: [batch, codes]
      properties:
        batch: {$ref: '#/components/schemas/AdminRedeemBatch'}
        codes:
          type: array
          items: {type: string}
          description: 明文兑换码，**唯一一次**返回；不落库、不写日志、不进审计，离开页面即丢失
    AdminReview:
      type: object
      required: [id, biz_type, biz_id, applicant_id, applicant_name, summary, state, created_at, anomaly]
      description: 审核队列行（`review/reviewItem`）+ 决策所需的业务事实
      properties:
        id: {type: integer, format: int64}
        biz_type: {type: string, enum: [QUOTA_APPLY, INVOICE_APPLY, REFUND_APPLY, REDEEM_BATCH, BALANCE_ADJUST]}
        biz_id: {type: integer, format: int64}
        biz_no: {type: string, description: 业务单号；该类型没有单号时不返回}
        applicant_id: {type: integer, format: int64}
