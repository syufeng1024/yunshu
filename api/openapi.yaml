        grant_bonus_micro: {type: integer, format: int64, description: 赠送积分，微积分}
        bonus_valid_days: {type: integer, description: 赠送积分有效天数}
        rpm: {type: integer}
        tpm: {type: integer}
        concurrency: {type: integer, description: 名义并发上限}
        daily_quota_micro: {type: integer, format: int64, nullable: true, description: '账户日额度；NULL = 无上限，0 = 继承上一档'}
        model_scope_mode: {type: string, description: V1.0 恒为 ALL}
        invoice_supported: {type: integer, enum: [0, 1]}
        sla_text: {type: string}
        permanent: {type: integer, enum: [0, 1]}
        sort_order: {type: integer}
    PublicPlansResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicPlan'}
    PublicModel:
      type: object
      required: [id, model_name, display_name, model_type, listing_state, context_window, input_price_micro_per_k, output_price_micro_per_k, protocols, recommend_weight, published_at]
      properties:
        id: {type: string, description: t_model.id 的十进制字符串}
        model_name: {type: string, description: 客户端可传入的对外模型名}
        display_name: {type: string}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING], description: 官网价格表只渲染 TEXT / IMAGE}
        listing_state: {type: string, enum: [LISTED], description: 公开列表只含 LISTED}
        context_window: {type: integer, format: int64, description: 对应 t_model.context_length}
        input_price_micro_per_k: {type: integer, format: int64, description: 当前生效价，微积分/千 token}
        output_price_micro_per_k: {type: integer, format: int64, description: 当前生效价，微积分/千 token}
        protocols:
          type: array
          description: 协议关联不到时为空数组，不猜测标签
          items: {type: string, enum: [OPENAI, ANTHROPIC]}
        recommend_weight: {type: integer, format: int64, description: 0 表示不进推荐位}
        published_at: {type: string, format: date-time, description: t_model.published_at；NULL 时回退 created_at}
    PublicModelsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicModel'}
    PublicAnnouncement:
      type: object
      required: [id, title, body, category, effective_at, published_at]
      properties:
        id: {type: string, description: t_announcement.id 的十进制字符串}
        title: {type: string}
        body: {type: string, description: 对应 t_announcement.content（字段名不同）}
        category: {type: string, enum: [PRICE, RATE_LIMIT, GENERAL]}
        effective_at: {type: string, format: date-time, description: 对应 t_announcement.effective_from}
        published_at: {type: string, format: date-time, description: 对应 t_announcement.created_at}
    PublicAnnouncementsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/PublicAnnouncement'}
    PublicEndpoint:
      type: object
      description: V1.0 无数据表，接口恒返回空数组（TODO T24）
      required: [id, name, base_url, line, description, role, status_page_url, health_status]
      properties:
        id: {type: string}
        name: {type: string}
        base_url: {type: string}
        line: {type: string}
        description: {type: string}
        role: {type: string, enum: [PRIMARY, BACKUP]}
        status_page_url: {type: string}
        health_status: {type: string, enum: [PASS, FAIL], nullable: true}
    PublicEndpointsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicEndpoint'}
    PublicIntegrationLink:
      type: object
      description: V1.0 无数据表，接口恒返回空数组（TODO T24）
      required: [tool_key, deep_link_template, enabled]
      properties:
        tool_key: {type: string}
        deep_link_template: {type: string, nullable: true, description: 后端持有的深链模板，浏览器不感知参数名}
        enabled: {type: boolean}
    PublicIntegrationLinksResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/PublicIntegrationLink'}
