            tool_call: {type: boolean}
            vision: {type: boolean}
            json_mode: {type: boolean}
        upstream_model_name:
          type: string
          minLength: 1
          maxLength: 128
          description: T45。上游真实模型名；与 primary_channel_id 同时给出时同事务建一条默认路由
        stream_supported:
          type: boolean
          default: true
          description: T45。默认路由是否支持流式；仅在创建默认路由时生效
    # T46: `PATCH /api/admin/models/{id}` 的请求体形状。该路径的 operation 尚未
    # 在本文件登记（与 GET /api/admin/models 同样属于未登记面），这里先把 schema
    # 固定下来，让 max_output_tokens 的写入口径有唯一出处，并供前端生成类型。
    # 字段全部可选；至少给一个，否则 400 invalid_request_body（message 为 body）。
    AdminModelPatchRequest:
      type: object
      minProperties: 1
      properties:
        model_name: {type: string, minLength: 1, maxLength: 128, description: 唯一改名入口（PRD F22-1）；与其它模型的名称或别名冲突时 400}
        display_name: {type: string, minLength: 1, maxLength: 128}
        region: {type: string, enum: [DOMESTIC, OVERSEAS], description: V1.0 只接受 DOMESTIC}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        protocol_id: {type: integer, format: int64, minimum: 1}
        primary_channel_id: {type: integer, format: int64, minimum: 1, description: 必须是境内渠道}
        context_length:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: |
            输入＋输出的总窗口；`0` = 未知（不做跨字段比较）。
            **跨字段约束（T48）**：本次请求不带 `max_output_tokens` 时，新值不得
            小于该行存量的 `max_output_tokens`，否则 400 `invalid_request_body`
            且 message 指向 `context_length`（例：「上下文长度 100 不能小于当前
            输出上限（1234）；如需下调请显式传入 max_output_tokens」）。
            存量上限为 0（未配置）时任意下调都放行。
            同一次请求里把两者一起下调是允许的——此时由 `max_output_tokens`
            一侧校验「新上限 ≤ 新上下文」，与字段先后无关。
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: |
            模型自身的输出上限（对应 `t_model.max_output_tokens`）。
            `0` = 未配置，网关按 `min(context_length, 32768)` 兜底估算。
            与平台输出上限（32768，客户端 `max_tokens` 的硬上限）不是同一个量。
            校验用「本次请求生效后的 context_length」：同一次 PATCH 里同时抬高
            两者是允许的；`max_output_tokens > context_length`（`context_length > 0`
            时）返回 400 `invalid_request_body`（message 为 `max_output_tokens`）。
        listing_state: {type: string, enum: [LISTED, CATALOG_ONLY, DELISTED], description: 转为 LISTED 时必须有生效中的价格}
        recommend_weight: {type: integer, format: int64, minimum: 0, maximum: 1000, description: 仅 LISTED 可非 0，离开 LISTED 自动归零}
        aliases:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 128}
        capabilities:
          type: object
          additionalProperties: {type: boolean}
          properties:
            stream: {type: boolean}
            tool_call: {type: boolean}
            vision: {type: boolean}
            json_mode: {type: boolean}
        reason: {type: string, description: 写审计用的变更原因}
    AdminModel:
      type: object
      required: [id, model_name, display_name, region, model_type, protocol_id, protocol, context_length, max_output_tokens, capability_mask, capabilities, listing_state, recommend_weight, aliases, pricing, created_at, updated_at]
      description: |
        模型主数据视图（`ops/modelView`）。字段直接对应 `modelSelectColumns`
        选出的列与 `attachModelDetails` 补齐的别名/能力/价目。
      properties:
        id: {type: integer, format: int64}
        model_name:
          type: string
          maxLength: 128
          description: 客户端可见的唯一标识（`t_model.model_name`），改名走 PATCH 的 model_name
        display_name: {type: string, maxLength: 128}
        region: {type: string, enum: [DOMESTIC, OVERSEAS]}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        protocol_id: {type: integer, format: int64}
        protocol: {type: string, description: 协议 code（`t_protocol.code`）}
        primary_channel_id:
          type: integer
          format: int64
          description: 缺省主渠道；未指定时该字段不返回（Go 侧 `omitempty`）
        context_length:
          type: integer
          format: int64
          minimum: 0
          description: 输入＋输出的总窗口（`t_model.context_length`）；0 = 未知
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
          description: |
            模型自身的输出上限（`t_model.max_output_tokens`）。
            `0` = 未配置，网关按 `min(context_length, 32768)` 兜底估算。
            与平台输出上限（32768，客户端 `max_tokens` 的硬上限）不是同一个量，
            不要混用；网关估算在该值 > 0 时直接采用它，不再裁剪到
            `context_length`。
        capability_mask: {type: integer, format: int64, description: 能力位图（bit0 STREAM / bit1 TOOL_CALL / bit2 VISION / bit3 JSON_MODE）}
        capabilities: {$ref: '#/components/schemas/ModelCapabilities'}
        listing_state: {type: string, enum: [LISTED, CATALOG_ONLY, DELISTED]}
        recommend_weight:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000
          description: 仅 LISTED 可为非 0；离开 LISTED 自动归零
        published_at:
          type: string
          format: date-time
          description: 首次上架时间；从未上架时不返回
        delisted_at:
          type: string
          format: date-time
          description: 转为 DELISTED 的时间；未下架时不返回
        aliases:
          type: array
          items: {type: string}
          description: 启用中的别名（`t_model_alias.alias_name`，`enabled = 1`）
        pricing:
          description: 当前生效价目（`t_price_rule`）；没有生效价目时为 null，不返回假的 0
          anyOf: [{$ref: '#/components/schemas/AdminModelPricing'}, {type: "null"}]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminModelPricing:
      type: object
      required: [price_rule_id, version, effective_from, in_price_micro_per_k, out_price_micro_per_k, per_call_price_micro]
      description: |
        模型当前生效的价目行（`ops/modelPricingView`）。与客户端目录的
        `ModelPricing` 不是同一个视图：这里没有换算成积分/人民币的展示字段，
        多出上游成本字段（仅运营与财务可见）。
      properties:
        price_rule_id: {type: integer, format: int64}
        version: {type: integer, format: int64}
        effective_from: {type: string, format: date-time}
        in_price_micro_per_k: {type: integer, format: int64, description: 每千输入 token 的微积分价}
        out_price_micro_per_k: {type: integer, format: int64}
        per_call_price_micro: {type: integer, format: int64, description: 按次计费价；0 = 不按次}
        cache_hit_ratio_bp: {type: integer, format: int64, description: 缓存命中计费比例（万分比）；未配置时不返回}
        cache_write_ratio_bp: {type: integer, format: int64, description: 未配置时不返回}
        long_ctx_threshold_tokens: {type: integer, format: int64, description: 长上下文档位起点；未配置时不返回}
        long_ctx_in_price_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        long_ctx_out_price_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        cost_in_micro_per_k: {type: integer, format: int64, description: 上游成本（每千输入 token）；未配置时不返回}
        cost_out_micro_per_k: {type: integer, format: int64, description: 未配置时不返回}
        cost_per_call_micro: {type: integer, format: int64, description: 未配置时不返回}
    AdminModelList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminModel'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer, format: int64}
