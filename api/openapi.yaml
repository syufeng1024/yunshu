        '503':
          description: 快照发布失败（config_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/models:
    get:
      operationId: listAdminModels
      tags: [admin]
      summary: 模型主数据分页列表（运营与财务共用，含上游成本价）
      description: |
        只返回未软删（`deleted_at IS NULL`）的行，权限是 `admin.read` 而不是
        `model.read`：该视图带上游成本价，`model.read` 留给客户端目录。
        `q` 同时匹配 `model_name`、`display_name` 与启用中的别名（`t_model_alias`），
        `!` 是 LIKE 转义符。
        `model_type` / `listing_state` / `region` / `protocol` 入参先 trim 再转大写，
        `text` 与 `TEXT` 等价。读操作不重发 `cfg:snap:ROUTING` 快照。
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 128}
          description: 按 rune 计数；超过 128 返回 400
        - name: model_type
          in: query
          schema: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        - name: listing_state
          in: query
          schema: {type: string, enum: [LISTED, CATALOG_ONLY, DELISTED]}
        - name: region
          in: query
          schema: {type: string, enum: [DOMESTIC, OVERSEAS]}
        - name: protocol
          in: query
          schema: {type: string, maxLength: 32}
          description: 协议 code（`t_protocol.code`）；超过 32 字符返回 400
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, model_name, recommend_weight, published_at]
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: 模型分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelList'
        '400':
          description: 分页或过滤参数非法（invalid_query_parameter，message 为具体参数名）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 admin.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createAdminModel
      tags: [admin]
      summary: 新建平台模型（可同时建默认路由）
      description: |
        同时给出 upstream_model_name 与 primary_channel_id 时，在同一事务内
        建一条默认 t_route（weight=100 / priority=100 / max_tokens_ceiling=0 /
        enabled=1，region 取渠道 region）。只给 upstream_model_name 不给
        primary_channel_id 返回 400 invalid_request_body。建了路由或
        listing_state=LISTED 时提交后重发快照。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminModelCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelDetail'
        '400':
          description: |
            字段非法（invalid_request_body）。注意 `model_name` 与已有模型重名也返回本码
            （走 CreateModel 的重名预检），不走 409。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 model.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            状态冲突（resource_state_conflict）。三种来源：
            ① `aliases` 已被其它模型占用，或某个别名等于其它模型的 `model_name`；
            ② `recommend_weight` 非 0 但 `listing_state` 不是 LISTED；
            ③ `listing_state=LISTED` 但该模型没有当前生效的价目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: |
            快照重发失败（config_unavailable）。建了默认路由或 `listing_state=LISTED`
            时提交后需重发 `cfg:snap:ROUTING`，失败即返回本码——数据已落库，
            但网关短期内仍按旧快照路由。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/models/{id}:
    get:
      operationId: getAdminModel
      tags: [admin]
      summary: 模型详情
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 模型详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelDetail'
        '400':
          description: 路径 id 不是正整数（invalid_request_body，message 为 id）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 admin.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 模型不存在或已软删（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateAdminModel
      tags: [admin]
      summary: 修改模型主数据（部分更新）
      description: |
        只更新请求体里出现的字段；一个可改字段都没给时返回 400
        `invalid_request_body`（message 为 `body`）。
        改名（`model_name`）只有在与当前值不同时才做唯一性检查：新名不得与其它
        模型的 `model_name` 或别名冲突。`primary_channel_id` 必须是境内渠道。
        转为 `LISTED` 时必须有当前生效价目；离开 `LISTED` 时
        `recommend_weight` 自动归零。写操作按需重发 `cfg:snap:ROUTING` 快照。
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminModelPatchRequest'
      responses:
        '200':
          description: 已更新，返回更新后的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelDetail'
        '400':
          description: |
            字段非法（invalid_request_body，message 指向具体字段：`body` / `id` /
            `model_name` / `display_name` / `region` / `model_type` / `protocol_id` /
            `primary_channel_id` / `context_length` / `max_output_tokens` /
            `listing_state` / `recommend_weight` / `aliases` / `capabilities`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 model.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 模型不存在或已软删（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            资源状态冲突（resource_state_conflict），三种来源：
            ① 新 `model_name` 或新 `aliases` 与其它模型的名称/别名冲突
               （与自身已有别名重复不算冲突，服务端静默去重）；
            ② 转 `LISTED` 但没配生效价目；
            ③ `recommend_weight` 非 0 而模型不是 `LISTED`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: |
            快照重发失败（config_unavailable）。**仅当**本次 PATCH 使 `listing_state`
            实际发生变化时才重发 `cfg:snap:ROUTING`（updateModel 的 `stateChanged`
            守卫）；失败即返回本码——数据已落库，但网关短期内仍按旧快照路由。
            只改 `recommend_weight`、`aliases` 等字段不触发重发。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/models/{id}/listing-state:
