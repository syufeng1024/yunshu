          schema: {type: string}
        - name: q
          in: query
          schema: {type: string, maxLength: 128}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
