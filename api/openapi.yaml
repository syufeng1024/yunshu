      operationId: setAdminModelListingState
      tags: [admin]
      summary: 单独修改模型的上架状态（可带变更原因）
      description: |
        等价于只 PATCH `listing_state`：走同一条更新路径，因此同样的前置条件
        生效（转 `LISTED` 需要生效价目；离开 `LISTED` 自动清零推荐权重），
        审计的 `reason` 取请求体的 `reason`。
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminModelListingStateRequest'
      responses:
        '200':
          description: 已更新，返回更新后的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelDetail'
        '400':
          description: 路径 id 或 `listing_state` 非法（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
