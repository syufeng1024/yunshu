  /api/admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin, audit]
      summary: 运营审计日志（按时间窗口、操作者、模块、动作、结果筛选）
      description: |
        固定 created_at DESC, id DESC（补录行也按真实时间排序），order 只接受 desc。
        默认窗口为最近 7 天，最大分页 100。action / result 可单独过滤：
        0024 的 idx_aal_created 与 idx_aal_action_created 保证时间窗口始终是
        索引范围扫描，不会退化成全表扫描。module / action / result 入参先
        trim 再转大写，与库中存储的枚举一致；超长值按 invalid_query_parameter 拒绝。
      security:
        - sessionCookie: []
      parameters:
        - name: operator_id
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 1}
          description: t_admin_audit_log.operator_id；0 与负数拒绝
        - name: module
          in: query
          required: false
          schema: {type: string, maxLength: 32}
          description: 如 USER / CHANNEL / FUND / TICKET / REFUND / QUOTA；大小写不敏感
        - name: action
          in: query
          required: false
          schema: {type: string, maxLength: 32}
          description: 如 LOGIN / CREATE / UPDATE / ORDER_PAID；可单独使用
        - name: result
          in: query
          required: false
          schema: {type: string, maxLength: 24}
          description: 如 OK / REJECTED_BY_GUARD / REJECTED；可单独使用
        - name: target_type
          in: query
          required: false
          schema: {type: string, maxLength: 32}
          description: 精确匹配 t_admin_audit_log.target_type（不转大小写，如 t_channel）；与 target_id 同传时走 idx_aal_target
        - name: target_id
          in: query
          required: false
          schema: {type: string, maxLength: 32}
          description: 精确匹配 target_id（字符串比较，不做数值转换）；建议与 target_type 同传
        - name: from
          in: query
          required: false
          schema: {type: string}
          description: RFC3339 或 YYYY-MM-DD（含当日 00:00:00）；省略则取 to 前 7 天
        - name: to
          in: query
          required: false
          schema: {type: string}
          description: RFC3339 或 YYYY-MM-DD（date-only 表示当日 23:59:59.999）；省略则为当前时刻
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: order
          in: query
          required: false
          schema: {type: string, enum: [desc], default: desc}
          description: 只接受 desc；asc 返回 400，避免升序分页永远不前进
      responses:
        '200':
          description: 审计日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          description: 参数不合法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 audit.read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/announcements:
    get:
      operationId: listAdminAnnouncements
      tags: [admin]
      summary: 公告分页列表（含草稿与已下线）
      description: 只列未软删的行。`state` 的 `SCHEDULED` 是「到点自动发布」的内部标记，与普通草稿必须区分，否则定时任务会把没审过的草稿发出去。
      security:
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          schema: {type: string, enum: [DRAFT, SCHEDULED, PUBLISHED, OFFLINE]}
        - name: ann_type
          in: query
          schema: {type: string, enum: [NOTICE, MAINTENANCE, PROMOTION, PRICE_CHANGE]}
        - name: pinned
          in: query
          schema: {type: string, enum: ['0', '1']}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, updated_at, effective_from, id]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        '200':
          description: 公告分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnouncementList'
        '400':
          description: 分页或过滤参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 notice.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createAdminAnnouncement
      tags: [admin]
      summary: 新建公告（publish_at 决定草稿 / 定时 / 立即发布）
      description: |
        `publish_at` 缺省 → `DRAFT`；给未来时间 → `SCHEDULED`；给当前或过去时间
        → `PUBLISHED`。`position_mask` 是 1..15 的位图（四个展示位）。
        `model_ids` 落 `t_announcement_model`，同时收窄 F16-4 的促销冲突检查；
        空数组表示不关联，冲突检查覆盖全部模型。
        `PROMOTION` 类公告若撞上任何模型 7 天涨价公示期，返回 400 并说明改类型或
        等公示期结束。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnnouncementCreateRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnouncementDetail'
        '400':
          description: |
            字段非法（invalid_request_body，message 指向 `title` / `content` /
            `ann_type` / `position_mask` / `effective_from` / `model_ids`），
            或活动类公告撞上涨价公示期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 notice.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/announcements/{id}/publish:
    post:
      operationId: publishAdminAnnouncement
      tags: [admin]
      summary: 发布公告（可指定发布时间）
      description: |
        已是 `PUBLISHED` 的公告重复发布返回 409。请求体可省略；给了
        `publish_at` 就按该时间发布。`PROMOTION` 类公告在发布时同样做涨价公示期
        冲突检查。
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAnnouncementPublishRequest'
      responses:
        '200':
          description: 已发布，返回公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnnouncementDetail'
        '400':
          description: 路径 id 或请求体非法，或活动类公告撞上涨价公示期（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 notice.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 公告不存在或已软删（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 公告已经是 PUBLISHED，无需重复发布（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/announcements/{id}:
    parameters:
      - $ref: '#/components/parameters/AnnouncementID'
    patch:
      operationId: updateAdminAnnouncement
      tags: [admin, announcement]
      summary: 编辑公告（DRAFT / SCHEDULED；PUBLISHED 与 OFFLINE 拒绝）
      description: |
        effective_from 是可见起点。请求同时带 publish_at 时，effective_from 不得
        早于它，否则返回 400 并点名 effective_from。已 PUBLISHED / OFFLINE 的
        公告不可编辑，返回 409 resource_state_conflict。model_ids 传 null/缺省
        表示保留现有 t_announcement_model 关联，传 [] 表示清空。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementWriteRequest'
      responses:
        '200':
          description: 更新后的公告
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetailResponse'
        '400':
          description: 字段不合法（invalid_request_body；effective_from / effective_to / model_ids）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 notice.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 公告不存在或已删除（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 已发布/已下线公告不可编辑（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/announcements/{id}/offline:
    parameters:
      - $ref: '#/components/parameters/AnnouncementID'
    post:
      operationId: offlineAdminAnnouncement
      tags: [admin, announcement]
      summary: 下线公告（DRAFT / SCHEDULED / PUBLISHED → OFFLINE）
      description: |
        OFFLINE 是展示终态，不是删除：行与审计保留。已 OFFLINE 的公告再次调用
        返回 409 resource_state_conflict，不静默成功。
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: 已下线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementDetailResponse'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 notice.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 公告不存在或已删除（resource_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 公告已下线（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: 运营概览（今日聚合、告警计数、待办计数）
      description: |
        今日 = UTC+8 自然日。today.requests 统计全部 t_usage_record 行；
        consumed_micro 求和全部行（失败行为 0）；success_rate_bp = SUCCESS /
        (http_status NOT IN (402,429))，该分母为 0 时返回 null，绝不返回 0。
        recon_diff = 近 30 天 status=OPEN 的 t_reconcile_diff；
        open_tickets = state IN (OPEN,RESPONDED)（未关闭）。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 运营概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 admin.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/users:
    get:
