openapi: 3.1.0
info:
  title: 云枢 API 控制面接口
  version: 0.1.0
  description: |
    T17 前端类型生成的最小骨架。只登记已验证存在的控制面路由与统一错误体；
    其余业务接口按任务卡扩充后重新生成，禁止在 web/src 手写响应类型。

    T12 已登记：/api/console/overview、/api/console/keys（列表/创建/详情/更新/删除/
    操作日志/轮换）、/api/console/models。
    T13 第一段已登记：/api/console/plans、/api/console/orders（列表/创建）、
    /api/console/redeem、公开回调 /api/v1/pay/callback/{channel}。
    T13 第二段已登记：/api/console/refunds、/api/console/invoices、
    /api/console/quota-applies、/api/console/trial/claim。
    运营后台与官网公开数据接口待 T15/T18。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: 进程存活检查
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: 依赖就绪检查
      responses:
        '200':
          description: 依赖全部就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 依赖未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/auth/register:
    post:
      operationId: postRegister
      tags: [auth]
      summary: 邮箱/手机号 + 密码注册
      description: |
        验证码字段 `code` 当前只接受空值：非空即 400（验证码属第二段交付）。
        注册在单个事务内写 t_user、空的 t_credit_account 与审计行；
        成功返回会话 cookie、可读的 `csrf` cookie 与响应体中的 `csrf_token`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功并已登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: 请求体或字段不合法（invalid_request_body / invalid_field）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 邮箱或手机号已注册（account_exists）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储不可用（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      operationId: postLogin
      tags: [auth]
      summary: 邮箱/手机号/用户名 + 密码登录
      description: |
        连续失败达到阈值后按 identifier + IP 锁定，锁定期内正确密码同样返回 429。
        账号维度返回 `login_locked`，IP 维度返回 `rpm_limit_exceeded`。
        成功返回会话 cookie、可读的 `csrf` cookie 与响应体中的 `csrf_token`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: 请求体或字段不合法（invalid_request_body / invalid_field）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 账号或密码错误（invalid_credentials，不区分账号是否存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: 账号因欠费冻结（account_frozen_due_to_overdraft）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 账号已禁用（account_disabled）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 失败次数过多（账号维度 `login_locked`；同一 IP 维度 `rpm_limit_exceeded`。均带 retry_after_seconds / reset_at，retry_after_seconds 为剩余锁定秒数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储或风控依赖不可用（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: 当前登录账号
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 账号不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/profile:
    patch:
      operationId: patchProfile
      tags: [auth]
      summary: 修改本人昵称与可选用户名
      description: |
        nickname 必填（与注册同一规则，去首尾空格后按 rune 计数 ≤ 64）。
        username 可选：**字段缺省**表示不改动；**空串**表示清空（清空后只能用
        邮箱/手机号登录；账号既无邮箱也无手机号时返回 400，避免把自己锁死）；
        非空值按与登录标识相同的规则归一化（3..32 字节、字母开头、仅
        a-z0-9._-、统一小写），并受 `uk_user_username` 唯一约束，重复时返回 409。
        本次改动不影响会话，响应回传更新后的账号。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: 更新后的账号
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '400':
          description: 字段不合法（invalid_request_body；nickname / username）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 用户名已被占用（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      operationId: postLogout
      tags: [auth]
      summary: 退出登录并清除会话
      security:
        - sessionCookie: []
      responses:
        '204':
          description: 会话已清除
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password:
    post:
      operationId: postPasswordChange
      tags: [auth]
      summary: 修改本人密码并吊销全部会话
      description: |
        old_password 必须匹配当前 bcrypt 哈希；new_password 与注册同一规则
        （8..72 字节，不允许纯空白）。改密成功后在事务内写审计行，再删除该
        uid 的全部 K20 会话；吊销失败返回 503 而不是 204，避免旧会话继续可用。
        校验旧密码失败返回 401，且不吊销现有会话、不写成功审计。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 密码已更新，所有会话已吊销，cookie 已清除
        '400':
          description: 请求体或字段不合法（invalid_request_body / invalid_field）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录、会话失效或旧密码错误（session_expired / invalid_credentials）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF token 缺失或不匹配（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储不可用，密码可能已更新（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password/reset:
    post:
      operationId: postPasswordReset
      tags: [auth]
      summary: 自助找回密码（验证码 + 新密码，匿名）
      description: |
        匿名接口：无会话要求，也**不校验 CSRF**（结构上是 public 路由，不进
        Session → CSRF → Require 链；伪造它拿不到受害者的 6 位验证码，加校验只会
        让「已登录用户在公共设备上重置」出现 403 死路）。

        校验顺序固定：字段 → 密码规则（8..72 字节、非纯空白）→ 验码 → 写库。
        弱密码或字段错误**不消耗**验证码；验码失败（码错/过期/未申请/尝试超限）与
        「账号不存在 / 已软删 / status≠NORMAL / 手机号歧义」统一返回同一个
        `invalid_credentials`，不区分账号是否存在。

        成功返回 204 且**不签发任何会话**：重置常发生在公共设备上，且「必须再登一次」
        是唯一能当场证明新密码可用的环节。成功后该 uid 的全部会话被吊销
        （RevokeAll），`password_is_initial` 置 0，登录失败计数 K28 被清空。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: 密码已重置，全部会话已吊销，cookie 已清除；不签发会话
        '400':
          description: 字段不合法（invalid_request_body）；含 AUTH_VERIFICATION_MODE=off 的 fail-closed 拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 验证码不正确、已过期、未申请、尝试超限或账号不可用（invalid_credentials）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储不可用或吊销失败（auth_unavailable；密码可能已更新）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/email/code:
    post:
      operationId: postEmailBindCode
      tags: [auth]
      summary: 发送绑定登录邮箱的验证码（已登录，purpose=bind）
      description: |
        单独成接口而不复用匿名的 `/api/v1/auth/verification-code`：后者的限流与
        「零区分 200」是按路径共享的，再加一个 `bind` 用途等于把「匿名向任意邮箱
        发信」的打击面放大一份。

        当前账号 `email` 非空时 400（本轮只做「为空时绑定」）；目标邮箱已被他人占用
        时 409 且**不发送**。限流四维：同地址 60s 冷却、地址日配额 10、**账号日配额 5**
        （`vc:quota:bind:uid:{uid}`，防止一个登录态变成免费发信器）、同 IP 每小时 10
        （跨用途共享，不因新增用途放大）。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBindCodeRequest'
      responses:
        '200':
          description: 验证码已发出（purpose=bind；正文为绑定专用文案）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCodeResponse'
        '400':
          description: 邮箱格式非法，或当前账号已绑定登录邮箱，或 AUTH_VERIFICATION_MODE=off（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话失效（session_expired）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 缺少角色权限或 CSRF token 不匹配（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 该邮箱已被其他账号使用（account_exists；不发送）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 60s 冷却 / 地址日配额 / 账号日配额 / IP 小时配额（rpm_limit_exceeded）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 邮件通道未配置或发送失败（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/email:
    post:
      operationId: postBindEmail
      tags: [auth]
      summary: 绑定登录邮箱（已登录，验码后写入 t_user.email）
      description: |
        验证 purpose=bind 的验证码后写入 `t_user.email`：

        ```sql
        UPDATE t_user SET email = ?, updated_at = ?
         WHERE id = ? AND deleted_at IS NULL AND (email IS NULL OR email = '')
        ```

        `RowsAffected = 0`（并发下已被绑定）与唯一键 1062 都映射为 409，**不允许**
        覆盖已有邮箱。写入与审计同事务；审计 `after_json` 只含
        `{"email_changed":true,"email":"a***@x.com"}`（不含明文地址）。

        成功后**不吊销会话**：绑定不改变 role / status / password_hash，会话绑的是 uid，
        下一次 `GET /auth/me` 自然带出新邮箱。目标账号一律取会话 uid，不接受任何
        `user_id` 参数。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBindRequest'
      responses:
        '200':
          description: 绑定成功，返回含新 email 的用户视图（不签发新会话）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 字段不合法、当前账号已绑定登录邮箱，或 AUTH_VERIFICATION_MODE=off（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录、会话失效或验证码不正确（session_expired / invalid_credentials）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 缺少角色权限或 CSRF token 不匹配（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 该邮箱已被使用（account_exists；含并发下 RowsAffected=0）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: 数据库错误（internal_error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/cancel:
    post:
      operationId: cancelAccount
      tags: [auth]
      summary: 注销当前账号（禁用账号、释放手机号并删除全部会话）
      description: |
        先调用 ticket.CheckAccountCancellable：存在 OPEN / RESPONDED 工单时返回
        409，并在 message 中列出全部未结工单号。请求体必填，`confirm` 必须与账号的
        登录标识一致（有邮箱 → 完整邮箱，归一化为去空格 + 小写；否则有手机号 → 后
        4 位；否则 → 用户名）。**三种失败统一同一个 400**：完全没传 body、`confirm`
        为空、`confirm` 与标识不一致，均为 `invalid_request_body`，
        `message = "请求体参数有误：confirm"`，只有 `hint` 按账号形态分档。
        成功后 status 置为 DISABLED、disable_source=SELF_CANCEL、
        cancel_apply_at=now；同一事务内把号码写入 `t_phone_claim`（cancel_count+1，
        trial_granted_at 取台账既有值或本行 trial_claimed_at）并把
        `t_user.phone` / `t_user.phone_hmac` 置 NULL —— 该手机号随即可以被任何账号
        重新注册，且同一号码 90 天内不能再领体验版。随后删除该 uid 的全部
        K20 / K30 会话键；旧 sid 立即失效。不新增 t_user.status 枚举值。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAccountRequest'
      responses:
        '204':
          description: 账号已禁用，手机号已释放，全部会话已吊销，cookie 已清除
        '400':
          description: |
            请求体缺失，或 confirm 为空 / 与登录标识不一致。三者返回同一个
            invalid_request_body，message 恒为「请求体参数有误：confirm」，
            只有 hint 按账号形态分档。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 未登录或会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF token 缺失或不匹配（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 存在未结工单，或账号已注销（resource_state_conflict；与本端点的 confirm 判定无关）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 会话存储不可用，注销可能已提交（auth_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/overview:
    get:
      operationId: getConsoleOverview
      tags: [console]
      summary: 账户概览（余额、今日用量、24h 曲线、四维额度、触顶预测）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 概览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          description: 会话失效（session_expired）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 account.read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys:
    get:
      operationId: listConsoleKeys
      tags: [console, keys]
      summary: 密钥列表（名称搜索 + 状态筛选取交集，分页）
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 64}
        - name: status
          in: query
          schema: {type: string, enum: [enabled, disabled]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, last_used_at, key_name]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleKeys
      tags: [console, keys]
      summary: 创建密钥（单条或批量 1–10；明文只在本次响应出现）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: 创建成功；items[].key 是唯一一次明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedKeys'
        '400':
          description: 字段非法（invalid_request_body）：含 group_code、count 超出 1–10、expire_at 不是未来时刻等
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 免费档活跃 Key 已达 quota.free_max_active_keys 上限（key_limit_reached）；message 给出上限、当前活跃数与本次新增数，hint 指向停用或升级套餐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      operationId: getConsoleKey
      tags: [console, keys]
      summary: 密钥详情（只返回掩码；越权与不存在同为 404 key_not_found）
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDetail'
        '404':
          description: 密钥不存在或不属于当前账号（key_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateConsoleKey
      tags: [console, keys]
      summary: 更新密钥（只更新传入字段；空数组与不传必须区分）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
      responses:
        '200':
          description: 更新结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKeyResponse'
        '400':
          description: 字段非法、group_code 出现、DISABLED 未带 confirm、model_ids 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: deleteConsoleKey
      tags: [console, keys]
      summary: 软删除密钥（confirm=true；key_hash 改写为哨兵，K13 即时删除）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean}
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer, format: int64}
                  deleted: {type: boolean}
        '400':
          description: 缺少 confirm 或出现 group_code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    get:
      operationId: listConsoleKeyAudit
      tags: [console, keys]
      summary: 密钥操作日志（含前后值）
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
