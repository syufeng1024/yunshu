        '404':
          description: 渠道不存在或已软删（channel_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 快照重发失败（config_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/channels/{id}/upstream-models:
    get:
      operationId: listAdminChannelUpstreamModels
      tags: [admin]
      summary: 用渠道自己的密钥读取上游 /v1/models
      description: |
        服务端解密 `upstream_key_enc` 后直接请求上游的 OpenAI 兼容 `/v1/models`，
        10 秒超时、响应体上限 1 MB。不走 `HTTPS_PROXY`（与控制面出口策略一致）。
        结果按 `id` 升序，并用 `t_channel.upstream_model_name_map` 标注
        `platform_model`。这是只读探测：不写库、不建模型。
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 上游模型清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUpstreamModelList'
        '400':
          description: 路径 id 不是正整数（invalid_request_body，message 为 id）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 channel.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 渠道不存在或已软删（channel_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 上游不可用、拒绝密钥或返回了无法解析的内容（upstream_all_failed / upstream_auth_failed / upstream_invalid_response）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 缺少 `CHANNEL_KEY_KEK`（config_unavailable）或密钥信封解不开（upstream_key_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/channels/{id}/register-upstream-models:
    post:
      operationId: registerAdminChannelUpstreamModels
      tags: [admin]
      summary: 把选中的上游模型登记为平台模型（CATALOG_ONLY）并建路由
      description: |
        服务端重新读一遍上游目录再落库，不信任请求里给的名字：`context_length`
        取上游报的值，`display_name` 取上游的 `name`（为空时用 id）。
        已登记（`t_model.model_name` 命中）的不重复建，但仍会补一条本渠道的
        `t_route`，所以重复点击是幂等的收尾而不是报错——这类行进 `skipped`，
        reason 为 `already_registered` 或 `already_registered_route_added`。
        定价与上架不在这里做：新建模型恒为 `CATALOG_ONLY` 且无价目。
        有新建行时提交后重发路由快照。
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterUpstreamModelsRequest'
      responses:
        '200':
          description: 登记结果（created 与 skipped 都是数组，可能为空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRegisterUpstreamModelsResult'
        '400':
          description: |
            路径 id、请求体、`model_ids`（空数组或超过 50 个）非法，或请求里有
            上游目录中不存在的模型名（invalid_request_body，message 会列出这些名字）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 model.write（permission_denied）——该路由比渠道写权限更严
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 渠道不存在或已软删（channel_not_found）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 上游不可用、拒绝密钥或返回了无法解析的内容（upstream_all_failed / upstream_auth_failed / upstream_invalid_response）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 缺少 `CHANNEL_KEY_KEK` / 信封解不开 / 快照重发失败（config_unavailable / upstream_key_unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/admin/routes:
