      summary: 我的工单列表（状态/类型筛选；只返回本人）
      security:
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          description: 只有 OPEN / RESPONDED / CLOSED 三态；其他值返回 400
          schema: {type: string, enum: [OPEN, RESPONDED, CLOSED, all]}
        - name: type
          in: query
          schema: {type: string, enum: [BILLING, TECH, CONTENT_APPEAL, OTHER, all]}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 工单列表；每项带 SLA 展示字段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 ticket.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleTicket
      tags: [console, ticket]
      summary: 提交工单（内容申诉自动带出命中规则 ID 与 request_id）
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: 已创建（state=OPEN，first_response_due_at = created_at + 4h）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTicket'
        '400':
          description: 类型/标题/正文非法，或内容申诉既未传 request_id 也未传 policy_hit_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 ticket.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: >-
            request_id / policy_hit_id 不存在、不属于当前账号或超过 90 天窗口（resource_not_found）。
            三种情况使用同一个码与同一段文案，不泄露存在性。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 内容申诉引用的命中记录不在可申诉状态或已超过 30 天（resource_state_conflict）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
