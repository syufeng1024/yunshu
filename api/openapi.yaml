          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      operationId: rotateConsoleKey
      tags: [console, keys]
      summary: 重新生成密钥（旧 Key 立即失效，无宽限期）
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expire_at: {type: string, format: date-time}
      responses:
        '201':
          description: 新密钥；key 是唯一一次明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedKey'
        '400':
          description: 旧 Key 已过期且未提供新的 expire_at、或出现 group_code（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 旧 Key 非活跃时轮换会新占一个名额，免费档已满（key_limit_reached）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 密钥不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/keys/{id}/reveal:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      operationId: revealConsoleKey
      tags: [console, keys]
      summary: 取回密钥明文用于复制（仅本人；每次成功记一条 VIEW_SECRET 审计）
      description: |
        明文只在响应里出现，前端直接写进剪贴板、不在页面渲染。

        用 POST 而不是 GET：会话鉴权下只有写方法走 CSRF 校验，而 GET 返回凭据
        可能被预取或被粘进链接。

        available=false 不是错误，而是「这把密钥的明文没有留存」的结论，附 reason：
        not_stored（加密存储上线前创建，哈希不可逆）、kek_unavailable（部署缺 KEK）、
        decrypt_failed（密文解不开）。三种情况的出路都是轮换。
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 明文，或 available=false 加原因
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealedConsoleKey'
        '404':
          description: 密钥不存在或不属于当前账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/console/models:
