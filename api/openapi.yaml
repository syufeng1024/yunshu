  /api/admin/reviews/{id}/approve:
    post:
      operationId: approveAdminReview
      tags: [admin]
      summary: 通过一张单据（审批人与申请人不得是同一人）
      description: |
        请求体可省略（空体等于不给 reason）。审核 `INVOICE_APPLY` 时必须给
        `invoice_url`：没有凭证的开票不允许被标记为已开具。
        不变量优先于请求体形状：**审批人 = 申请人时一律 403 `permission_denied`**
        （职责分离，不是参数错误），且这次拒绝会写一条拒审记录。队列行不是
        PENDING 时返回 409。通过与对应业务状态的推进在同一事务内完成。
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReviewDecisionRequest'
      responses:
        '200':
          description: 已通过，返回更新后的队列行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReviewDetail'
        '400':
          description: 请求体非法，或审核 INVOICE_APPLY 时缺 `invoice_url`（invalid_request_body）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 fund.approve，或审批人即申请人（permission_denied，职责分离）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 审核任务不存在（resource_not_found；路径 id 非正整数同样返回 404）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 队列行已不是 PENDING（resource_state_conflict，message 带出当前状态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
