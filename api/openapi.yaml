  /api/admin/groups/{id}:
    patch:
      operationId: updateAdminGroup
      tags: [admin]
      summary: 修改价格分组（倍率、范围、毛利下限、启停）
      description: |
        倍率可以给 `ratio_bp`（整数万分比）或 `ratio`（十进制，最多 4 位小数），
        两个都给时必须一致，否则 400。`ratio` = 0 只允许 `internal` 分组
        （语义是「不计费」），其它分组必须 > 0。
        `internal` 分组保存还额外要求：`confirm=true` + 非空 `reason`，且
        `channel_scope_mode=SELECTED` 的白名单里不能包含当前权重最高的启用渠道。
        改倍率（非 internal）会对范围内每个模型做毛利地板校验；范围内有无成本价
        的模型时，需要 `confirm=true` 才继续，否则 400 并额外返回 `warnings[]`。
        倍率真的变了才把新倍率下发给该分组用户的 Key，响应里的 `key_sync` 说明
        同步结果。
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGroupPatchRequest'
      responses:
        '200':
          description: 已更新，返回分组与 Key 同步结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroupDetail'
        '400':
          description: |
            字段非法或无字段可改（invalid_request_body，message 为 `body` 或具体
            字段名）；范围内有无成本价模型且未确认时，响应体额外带 `warnings[]`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroupUpdateError'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 group.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 分组不存在（resource_not_found）
          content:
