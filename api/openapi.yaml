        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 user.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createOperatorUser
      tags: [admin]
      summary: 开通运营/财务账号（超级管理员在后台开通，不再写库）
      description: |
        运营与财务账号只能由管理员在后台开通。权限点是 admin.all，而不是
        user.write：user.write 归 OPS 所有，而本接口的角色来自请求体，给了
        user.write 就等于让运营账号能造一个 SUPER_ADMIN 再登录它（自提权）。

        role 只接受 OPS / FINANCE / SUPER_ADMIN。传 PERSONAL 返回 400
        invalid_request_body（字段 role）：客户账号必须走公开注册
        POST /api/v1/auth/register，那条路径带体验积分、设备指纹与协议同意，
