  /api/console/orders:
    get:
      operationId: listConsoleOrders
      tags: [console, fund]
      summary: 充值订单列表（状态筛选 + 订单号搜索，交集）
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, paid, closed, refunding, refunded]}
        - name: q
          in: query
          description: 订单号片段
          schema: {type: string, maxLength: 32}
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: sort
          in: query
          schema: {type: string, enum: [created_at, paid_at]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc]}
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          description: 查询参数非法（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createConsoleOrder
      tags: [console, fund]
      summary: 创建充值/套餐订单（金额由服务端按 t_plan 计算；PENDING 不入账）
      security:
        - sessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: 10s 去重窗口（idem.duplicate_window_seconds）；窗口内重放返回同一订单
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 新建订单（PENDING，积分未变）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrder'
        '200':
          description: 同一 Idempotency-Key 的重放，返回首次创建的订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOrder'
        '400':
          description: 字段非法（invalid_request_body）：order_type / plan_id / pay_amount_fen / pay_channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 同一 Idempotency-Key 的首次请求仍在处理中（request_in_flight）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
