      tags: [admin]
      summary: 手工导入上游账单（对账数据，按渠道 + 账期幂等 upsert）
      description: |
        `rows` 全部校验通过才开事务：第 N 行有问题时表不会被写进 1..N-1 行。
        `bill_period` 只接受 `YYYY-MM-DD` 或 `YYYYMMDD` 两种按日账期——月度账期
        虽然列注释允许，但对账按日读取，写进去也永远不会被看到，所以这里直接
        400。每行原样存进 `raw_row`，未知上游列既不报错也不丢。
        返回的 inserted / updated / unchanged 来自 upsert 的影响行数。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpstreamBillImportRequest'
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUpstreamBillImportResult'
        '400':
          description: |
            请求体或字段非法（invalid_request_body，message 指向 `channel_id` /
            `bill_period` / `rows` 或 `rows[i].<字段>`），或 rows 超过 5000 行，
            或 channel_id 不存在
          content:
            application/json:
