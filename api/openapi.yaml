    AdminModelCreateRequest:
      type: object
      required: [model_name, display_name, region, model_type, protocol_id]
      properties:
        model_name: {type: string, minLength: 1, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 128}
        region: {type: string, enum: [DOMESTIC, OVERSEAS]}
        model_type: {type: string, enum: [TEXT, IMAGE, EMBEDDING]}
        protocol_id: {type: integer, format: int64, minimum: 1}
        primary_channel_id: {type: integer, format: int64, minimum: 1, description: 给出 upstream_model_name 时必填，否则 400 invalid_request_body}
        context_length: {type: integer, format: int64, minimum: 0, maximum: 100000000}
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: |
            模型自身的输出上限（对应 `t_model.max_output_tokens`）。
            `0` = 未配置，网关按 `min(context_length, 32768)` 兜底估算。
            与平台输出上限（32768，客户端 `max_tokens` 的硬上限）不是同一个量，
            不要混用。`context_length > 0` 时不得超过 `context_length`，越界返回
            400 `invalid_request_body`（message 为 `max_output_tokens`）；
            `context_length` 为 0（未知）时只要求 `>= 0`。
        listing_state: {type: string, enum: [LISTED, CATALOG_ONLY, DELISTED], default: CATALOG_ONLY}
        recommend_weight: {type: integer, format: int64, minimum: 0, maximum: 1000}
        aliases:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 128}
        capabilities:
          type: object
          additionalProperties: {type: boolean}
          properties:
