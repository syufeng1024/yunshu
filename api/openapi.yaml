        '200':
          description: 配置项全量列表（不分页）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigList'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
