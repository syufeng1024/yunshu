          description: 角色缺少 config.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: putAdminConfig
      tags: [admin]
      summary: 批量写入运行时配置并发布（部分键、原子生效）
      description: |
        `values` 是 key → 原始 JSON 值的映射，一次最多写
        `RuntimeKeyCount` 个键。校验顺序：非空 → 键数上限 → 键是否可在线改 →
        值是否通过该键自己的校验器。任一键不合法整批拒绝（`config_value_invalid`，
        message 指出是哪个键）。写入后发布配置快照，发布失败返回 503——
        已落库但网关还看不到。
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminConfigUpdateRequest'
      responses:
        '200':
          description: 已写入并发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfigUpdateResult'
        '400':
          description: values 为空（invalid_request_body）或某个键/值不合法（config_value_invalid）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 config.write（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 配置中心不可用或快照发布失败（config_unavailable）
          content:
            application/json:
              schema:
