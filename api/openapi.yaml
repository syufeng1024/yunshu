  /api/console/usage:
    get:
      operationId: getConsoleUsage
      tags: [console, usage]
      summary: 用量聚合（模型/渠道/日维度；计费列仅 SUCCESS）
      description: |
        维度切换只改 GROUP BY，model_id/channel_id 等筛选条件保持并回显在 filter。
        排序为消耗积分降序、维度键升序。金额提供 amount_fen 与两位小数的 amount_yuan。
        口径分层：request_total/request_success/success_rate_bp 统计全部 result（含 FAILED）；
        tokens_in/tokens_out/consumed_* 与金额只累加 result='SUCCESS' 的行。
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          description: RFC3339 或 YYYY-MM-DD；默认 now-7d；不得早于 now-365d
          schema: {type: string}
        - name: to
          in: query
          schema: {type: string}
        - name: dimension
          in: query
          schema: {type: string, enum: [model, channel, day], default: model}
        - name: model_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: channel_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: 用量聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          description: 查询参数非法或超出 365 天在线窗口（invalid_query_parameter）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: 会话失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 角色缺少 usage.read（permission_denied）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
