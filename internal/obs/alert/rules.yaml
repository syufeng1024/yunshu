# 运维告警规则（T22 交付物 8）
#
# 加载方式：Prometheus rule_files 指向本文件，例如
#   rule_files:
#     - /etc/prometheus/rules/yunshu/*.yaml
# 也可以先用 promtool 校验：promtool check rules internal/obs/alert/rules.yaml
#
# 两条硬约束（T22 §4 第 12、13 条）：
#   1. 每条告警都必须可执行：annotations.runbook 写「看到它该做什么」，并指向
#      docs/ops-runbook.md 的具体章节。只报警不给处置步骤的规则不算交付。
#   2. 对账差异 > 0 是 P0（R-01），没有 for 延迟：金额不一致等一分钟都可能扩大。
#
# 指标名一律来自 internal/obs/metrics/recorder.go，不在这里发明新名字。
# 任何本仓没有独立埋点的规则，都在该处写明「无埋点」与替代巡检方式，
# 不要为了让 YAML 好看而编一个指标名。
#
# 埋点与规则的对应关系由测试钉住（改一边就红），不要只改 YAML：
#   gw_settle_backlog_tasks  ← settle.BacklogWarnThreshold  ↔ TestBacklogWarnThresholdMatchesAlertRule
#   gw_ticket_sla_overdue    ← ticket.FirstResponseOverdueSQL ↔ TestTicketSLAOverdueMatchesOverview
#   平台白名单 8 码          ← apierr.PlatformAvailabilityCodes ↔ TestPlatformErrorRateRuleMatchesWhitelist

groups:
  - name: yunshu-gateway
    interval: 30s
    rules:
      # ---------------------------------------------------------------- P0
      # 对账差异。gauge 由 recon.Daily 在最近一次成功运行后设置，懒创建：
      # 序列不存在 = 还没有成功跑过对账，不是「零差异」。
      - alert: ReconDiffDetected
        expr: gw_ledger_reconcile_diff > 0
        for: 0m
        labels:
          severity: P0
          team: finance
        annotations:
          summary: '对账差异 {{ $value }} 条（P0，资金口径）'
          description: >-
            最近一次成功对账发现 {{ $value }} 条内部账本与上游/内部账不平。
            先看 t_reconcile_diff 的 diff_type 与 delta_micro：金额非零即按
            P0 SOP 处理，禁止改历史数据让断言变绿。
          runbook: 'docs/ops-runbook.md §3 R-01 六步处置'

      # 关单失败：自动关单任务关不掉单，队列只增不减。
      - alert: OrderAutoCloseFailing
        expr: increase(gw_order_auto_close_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: P1
          team: finance
        annotations:
          summary: '自动关单失败（stage={{ $labels.stage }}）'
          description: >-
            stage=audit 表示审计写入失败（状态已随事务回滚，单仍是 PENDING）；
            stage=db 看 MySQL 可用性与慢查询；stage=scan 表示扫描查询本身失败。
            修好后重跑即收敛，重复执行不会产生第二条审计。
          runbook: 'docs/ops-runbook.md §7 其余任务的失败处置（close_expired_order）'

      # ------------------------------------------------ 限流拒绝率（PRD §9.5）
      # 口径：拒绝量占全部请求的比例。它是 §9.5「误杀率」的**上界代理**，不是误杀率本身
      # ——误杀要求「重算真实用量后本可放行」，而本仓没有被拒请求的用量数据
      # （详见 docs/tasks/errata.md E-37）。因此这条告警只能回答「拒绝是不是变多了」。
      #
      # 阈值来源：PRD §9.5 的可接受上限 0.5%（超过即「限流设计缺陷」）。月度目标
      # 0.1% 不设成告警线——它会让 P1 长期常亮，反而失去信号；0.1% 写进 description
      # 供复盘对照。
      - alert: RatelimitRejectRatioHigh
        expr: >-
          (
            sum(rate(gw_ratelimit_rejected_total[5m]))
            /
            sum(rate(gw_requests_total[5m]))
          ) > 0.005
          and
          sum(increase(gw_requests_total[5m])) > 1000
        for: 30m
        labels:
          severity: P1
          team: platform
        annotations:
          summary: '限流拒绝率 {{ $value | humanizePercentage }}（PRD §9.5 可接受上限 0.5%）'
          description: >-
            持续等于或高于 0.5% 视为限流策略缺陷，不得用「用户余额本来就少」解释。
            复盘对照 §9.5 的月度目标 0.1%。先按 dim 拆分（rpm / tpm / concurrency /
            daily）定位是哪个维度在拒，再对比 gw_ratelimit_degraded_total：
            该计数器只在 Redis 失败导致的本地判定时自增（G29），Redis 健康时不涨，
            所以「degraded 同时在该维度上涨」才是「降级期的拒绝属预期行为」。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # 单维度触到月度目标（0.1%）就告警：任何单一维度自己就吃掉整个目标额度，
      # 意味着该月目标已经不可能达成。阈值 0.1% 直接取自 PRD §9.5 的目标值，
      # 不是另给一个数。
      #
      # expr 写法说明（为什么分母用 scalar()、and 用 on()）：左侧 sum by (dim)
      # 的标签集是 {dim}，右侧 sum(...) 的标签集是空集。PromQL 的一对一向量匹配
      # 要求两边标签集完全相同，否则该侧序列不会进入结果——不 scalar() 的话除法
      # 会得到空向量、and 也匹配不上，整条规则永不触发（且 promtool check rules
      # 查不出这类错）。scalar() 把分母压成标量、绕开向量匹配；and 用 on() 显式
      # 只按空标签集匹配，两边都能对上。
      #
      # 阈值借自 PRD §9.5 的「误杀率」上限/目标，此处当作「拒绝率」的代理上限，
      # 偏严（误杀 ⊆ 拒绝）。这是拒绝率，不是误杀率，不得对外声称误杀水平。
      - alert: RatelimitRejectRatioHighByDim
        expr: >-
          (
            sum by (dim) (rate(gw_ratelimit_rejected_total[5m]))
            /
            scalar(sum(rate(gw_requests_total[5m])))
          ) > 0.001
          and on()
          (sum(increase(gw_requests_total[5m])) > 1000)
        for: 30m
        labels:
          severity: P2
          team: platform
        annotations:
          summary: '限流维度 {{ $labels.dim }} 单独拒绝率 {{ $value | humanizePercentage }}（§9.5 目标 0.1%）'
          description: >-
            单维度独立超过月度目标值，说明这一维的阈值（rpm / tpm / concurrency /
            daily）对当前流量形态偏紧。先确认不是降级（gw_ratelimit_degraded_total
            同维度在涨），再看该维度的配置是否与套餐档匹配。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # ------------------------------------------------------- 容量与错误率
      # 结算积压。数值来自 gw_settle_backlog_tasks：jobsd 每 30s 执行
      # settle.PendingCountSQL（`SELECT COUNT(*) FROM t_settle_task WHERE state=?`），
      # 与网关背压判定用的是同一条语句，不存在第二份口径（G24）。
      #
      # 阈值 4500 = settle.BacklogThreshold(5000) 的 90%，定义在
      # internal/settle/backlog.go 的 BacklogWarnThreshold；PromQL 引不了 Go 常量，
      # 所以这里的字面量由 TestBacklogWarnThresholdMatchesAlertRule 钉住，改一边
      # 测试就红。为什么不在 5000 才报：越过 5000 后网关已经开始拒绝新请求
      # （gw_backpressure_rejected_total{tier="backlog"}），那条是滞后信号；
      # 容量预警要更早，留出排查与扩容的时间。
      #
      # max() 而不是 sum()：gauge 是每个 jobsd 副本各自采样的同一张表的同一个数，
      # 几个副本相加会把积压量乘上副本数。
      - alert: SettleBacklogOverThreshold
        expr: max(gw_settle_backlog_tasks) > 4500
        for: 5m
        labels:
          severity: P1
          team: platform
        annotations:
          summary: '结算积压 {{ $value }} 条，逼近 5000 条背压线'
          description: >-
            settle.BacklogThreshold = 5000 条 PENDING（不是秒）；4500 是提前预警线。
            先确认 jobsd 的 P26 结算消费者是否存活（/readyz 的 settle 与
            t_settle_task 的 PENDING 计数），再确认上游结算是否整体变慢。
            若已开始出现 gw_backpressure_rejected_total{tier="backlog"}，按已触发背压处置。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # 平台侧错误率。分子按 PRD §9.3 的 8 条平台白名单码，不把上游 5xx 算进来：
      # 否则上游抖动会冒充平台故障，或反过来被平台故障掩盖。
      #
      # 白名单的唯一定义是 internal/apierr/availability.go 的
      # PlatformAvailabilityCodes()；这里只能重复一份正则（PromQL 引不了 Go），
      # 两边由 TestPlatformErrorRateRuleMatchesWhitelist 钉住。**不要按 Owner 过滤**：
      # OwnerPlatform 有 12 条码，多出的 4 条（price_not_configured 与三个上游凭据码）
      # 不在分子里，按 Owner 算会把上游故障算成平台故障（G26）。
      - alert: PlatformErrorRateHigh
        expr: >-
          (
            sum(rate(gw_requests_total{err_code=~"rate_limiter_unavailable|config_unavailable|auth_unavailable|settlement_unavailable|backpressure_rejected|backpressure_stream_rejected|internal_error|convert_failed"}[5m]))
            /
            sum(rate(gw_requests_total[5m]))
          ) > 0.01
          and
          sum(increase(gw_requests_total[5m])) > 100
        for: 5m
        labels:
          severity: P1
          team: platform
        annotations:
          summary: '平台侧错误率 {{ $value | humanizePercentage }}（阈值 1%）'
          description: >-
            分子 = PRD §9.3 的 8 条平台白名单码，分母 = 全部请求（含 429/402）。
            按 err_code 排序先修占比最高的那条码；样本 < 100 次时不断言（and 条件）。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # ------------------------------------------------------------- 延迟（分流式）
      # 120s 的来源：`gw.DefaultClientBudgetMS = 120_000`（= 种子值
      # gw.client_timeout_budget_ms），即**非流式**请求的客户端超时预算
      # （TDS §5.3）。超过它，这条请求在客户端侧已经断了，网关再快也没意义。
      #
      # 必须带 {stream="false"}：`gw_request_duration_seconds` 同时记流式与非流式，
      # 而流式的预算是 600s（`gw.DefaultStreamBudgetMS`）。不分流的后果是——一条
      # 健康的长流式请求（比如 8 分钟的大输出）会把 P99 顶过 120s，触发一条不说明
      # 任何问题的 P2（G27）。埋点本身不用改：`stream` 标签一直都在。
      - alert: GatewayLatencyP99High
        expr: >-
          histogram_quantile(0.99,
            sum by (le) (rate(gw_request_duration_seconds_bucket{stream="false"}[5m]))
          ) > 120
        for: 10m
        labels:
          severity: P2
          team: platform
        annotations:
          summary: '网关非流式 P99 延迟 {{ $value | printf "%.1f" }}s（阈值 120s = 客户端超时预算）'
          description: >-
            只统计非流式请求。120s 是 gw.client_timeout_budget_ms 的种子值：
            P99 触到它就意味着至少 1% 的非流式请求在客户端侧已经超时。
            先看 gw_upstream_attempts_total 的失败分类与 gw_circuit_state，
            再看是否单渠道劣化（按 channel_id 拆分）。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # 流式单独一条，阈值从 600s 的流式总预算推导：540s = 90% × 600s
      # （`gw.DefaultStreamBudgetMS` = 种子值 gw.stream_total_ms）。与非流式那条
      # 的 120s 无关，**不要复用**——两个预算是两个数量级的事。
      #
      # 为什么是 90% 而不是 600s：到了 600s 网关会主动收尾（TDS §5.3 的
      # StreamTotal 上限），P99 卡在 600 说明已经有 1% 的流被截断，那是故障而不是
      # 预警。540s 留出一分钟给值班判断「是不是上游在挤牙膏」。
      #
      # 桶边界：gw_request_duration_seconds 的桶现在到 600s（见
      # metrics.DurationBuckets），否则 histogram_quantile 在 +Inf 桶里只能返回
      # 最高有限边界（300s），这条规则会永远为假——那才是真正没人发现的假绿。
      - alert: GatewayStreamLatencyP99High
        expr: >-
          histogram_quantile(0.99,
            sum by (le) (rate(gw_request_duration_seconds_bucket{stream="true"}[5m]))
          ) > 540
        for: 10m
        labels:
          severity: P2
          team: platform
        annotations:
          summary: '网关流式 P99 延迟 {{ $value | printf "%.1f" }}s（阈值 540s = 600s 流式预算的 90%）'
          description: >-
            只统计流式请求。540s 逼近 gw.stream_total_ms 的种子值 600s：
            持续超过说明整体在接近「请求被网关主动收尾」的边界。
            先看 gw_ttft_seconds（P99 15s）判断是首字节慢还是生成慢，
            再看 gw_upstream_attempts_total 的失败分类与单渠道状态。
            单个长请求不是问题，P99 才是——不要把这条告警当成「有人发了长请求」。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # 熔断。1=OPEN。
      - alert: CircuitBreakerOpen
        expr: max by (channel_id) (gw_circuit_state) == 1
        for: 2m
        labels:
          severity: P2
          team: platform
        annotations:
          summary: '渠道 {{ $labels.channel_id }} 熔断 OPEN 超过 2 分钟'
          description: >-
            OPEN 表示该渠道连续失败已被摘除。单渠道 OPEN 时看 t_upstream_attempt
            的 error_class（超时 / 5xx / 4xx）；全部渠道 OPEN 时按「上游整体不可用」
            处理，不要在网关侧反复重启。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # Redis 不可用导致限流 fail-close（503 rate_limiter_unavailable）。
      # 任何一次都告警：它既是可用性分子，也意味着那一刻起所有请求 503。
      - alert: RatelimitUnavailable
        expr: increase(gw_ratelimit_unavailable_total[5m]) > 0
        for: 0m
        labels:
          severity: P1
          team: platform
        annotations:
          summary: '限流 Redis 不可用，请求按 fail-close 拒绝（dim={{ $labels.dim }}）'
          description: >-
            PRD §9.8 / T22 §4 第 5 条：资金相关维度必须 fail-close，不得放行。
            确认 Redis 连通性与 CONFIG GET maxmemory-policy，恢复后限流自动回到
            正常态（见 docs/degradation.md「恢复」一节）。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'

      # --------------------------------------------------------- SLA 工单超时
      # gw_ticket_sla_overdue 由 jobsd 每 30s 采样，SQL 是
      # ticket.FirstResponseOverdueSQL（state='OPEN' AND first_responded_at IS NULL
      # AND first_response_due_at < now），与 GET /api/admin/overview 的
      # alerts.sla_overdue 是同一条语句——页面与告警不可能报出两个数（G25）。
      #
      # 为什么是 gauge 而不是计数器：工单被回复或关闭后就不再超时，计数器只会一路上涨，
      # 涨到多少都不说明当前欠了几张单。
      #
      # summary 里的 4 小时来自 PRD §9.2 对外承诺（首次响应 ≤ 4h）；阈值只能是 > 0：
      # 承诺是对外写死的，欠一张就已经违约，没有「允许欠几张」的档位。
      - alert: TicketSLAFirstResponseOverdue
        expr: max(gw_ticket_sla_overdue) > 0
        for: 0m
        labels:
          severity: P1
          team: support
        annotations:
          summary: '工单首响超时 {{ $value }} 条（PRD §9.2 承诺 4 小时内首次响应）'
          description: >-
            已超时仍未首次回复的 OPEN 工单数。按 first_response_due_at 升序认领
            （登录后台 /admin/tickets 打开「SLA 超时」筛选即可拿到同一份队列）。
            不要用自动关闭「解决」它——那会把「平台没回」记成「工单已了结」，
            SLA 数据从此不可信（PRD F21-2）。
          runbook: 'docs/ops-runbook.md §8 容量与限流告警'
